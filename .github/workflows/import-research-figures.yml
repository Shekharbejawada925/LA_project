name: Import archived research figures

on:
  push:
    paths:
      - '.github/workflows/import-research-figures.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract original research figures and portfolio PDF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          root = Path(".")
          with ZipFile(root / "CausalEdu_Shekhar_Final_GitHub.zip") as z:
              for i in range(1, 5):
                  content = z.read(f"figures/original_figure_{i}.png")
                  target = root / "figures" / f"original_figure_{i}.png"
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(content)
              target = root / "report" / "portfolio_report.pdf"
              target.write_bytes(z.read("portfolio_report.pdf"))
          PY
      - name: Commit extracted research assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add figures/original_figure_*.png report/portfolio_report.pdf
          if ! git diff --cached --quiet; then
            git commit -m "assets: publish four original research figures and portfolio report"
            git push origin HEAD:main
          fi
